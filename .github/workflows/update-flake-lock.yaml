name: Update flake.lock

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}

jobs:
  update:
    name: Update flake.lock
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Update flake.lock
        id: pr
        uses: DeterminateSystems/update-flake-lock@v29
        with:
          # See update.yaml
          token: ${{ secrets.UPDATE_TOKEN || github.token }}
          branch: update/flake-lock
          pr-title: Update flake.lock
          pr-labels: dependencies

      - name: Enable auto-merge
        if: steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.UPDATE_TOKEN || github.token }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
        run: gh pr merge --repo "$GITHUB_REPOSITORY" --auto --squash "$PR"
